{% extends "base.html" %}
{% block title %}비밀번호 찾기 · {{ t('app_name') }}{% endblock %}
{% block content %}
<section class="auth-shell">
    <div class="auth-card">
        <span class="eyebrow">비밀번호를 잊으셨나요?</span>
        <h1>비밀번호 찾기</h1>
        <p class="muted">가입한 이메일을 입력하면 재설정 링크를 별냅니다.</p>
        <form method="post" class="stack-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>이메일
                <input type="email" name="email" required autocomplete="email" placeholder="가입한 이메일">
            </label>
            <button class="button primary full" type="submit">재설정 링크 받기</button>
        </form>
        <p class="form-foot">비밀번호가 기억났나요? <a href="{{ url_for('auth.login') }}">로그인</a></p>
    </div>
</section>
{% endblock %}
