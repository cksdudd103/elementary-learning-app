{% extends "base.html" %}
{% block title %}로그인 · {{ t('app_name') }}{% endblock %}
{% block content %}
<section class="auth-shell">
    <div class="auth-card">
        <span class="eyebrow">다시 만나 반가워요!</span>
        <h1>로그인</h1>
        <p class="muted">오늘의 10문제를 시작해 볼까요?</p>

        <div class="auth-tabs" role="tablist">
            <button type="button" class="auth-tab {% if tab != 'student' %}active{% endif %}" data-tab="general" role="tab" aria-selected="{% if tab != 'student' %}true{% else %}false{% endif %}">아이디 로그인</button>
            <button type="button" class="auth-tab {% if tab == 'student' %}active{% endif %}" data-tab="student" role="tab" aria-selected="{% if tab == 'student' %}true{% else %}false{% endif %}">학생 간편 로그인</button>
        </div>

        <form method="post" class="stack-form auth-tab-panel {% if tab != 'student' %}active{% endif %}" id="panel-general">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>아이디 또는 이메일<input name="identity" required autocomplete="username"></label>
            <label>비밀번호<input type="password" name="password" required autocomplete="current-password"></label>
            <div class="auth-options">
                <label class="check-row"><input type="checkbox" name="remember"> 로그인 상태 유지</label>
                <a href="{{ url_for('auth.forgot_password') }}">비밀번호 찾기</a>
            </div>
            <button class="button primary full" type="submit">로그인</button>
        </form>

        <form method="post" class="stack-form auth-tab-panel {% if tab == 'student' %}active{% endif %}" id="panel-student">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <p class="muted">학생은 이름, 학년, PIN을 입력하면 바로 시작할 수 있어요.</p>
            <label>이름<input name="display_name" required autocomplete="name"></label>
            <label>학년
                <select name="grade_level" required>
                    {% for g in range(1, 10) %}
                    <option value="{{ g }}" {% if g == 4 %}selected{% endif %}>{{ g }}학년</option>
                    {% endfor %}
                </select>
            </label>
            <label>PIN (4자리 숫자)
                <input type="password" name="simple_pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="4자리 숫자" required>
            </label>
            <button class="button primary full" type="submit">학생 로그인</button>
        </form>

        <p class="form-foot">처음인가요? <a href="{{ url_for('auth.register') }}">회원가입</a></p>
    </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const tabs = document.querySelectorAll('.auth-tab');
    const panels = document.querySelectorAll('.auth-tab-panel');
    tabs.forEach(function(tab) {
        tab.addEventListener('click', function() {
            const target = tab.dataset.tab;
            tabs.forEach(function(t) {
                t.classList.remove('active');
                t.setAttribute('aria-selected', 'false');
            });
            panels.forEach(function(p) {
                p.classList.remove('active');
            });
            tab.classList.add('active');
            tab.setAttribute('aria-selected', 'true');
            document.getElementById('panel-' + target).classList.add('active');
        });
    });
});
</script>
{% endblock %}
