{% extends "base.html" %}
{% block title %}회원가입 · {{ t('app_name') }}{% endblock %}
{% block content %}
<section class="auth-shell">
    <div class="auth-card">
        <span class="eyebrow">나만의 학습 공간 만들기</span>
        <h1>회원가입</h1>
        <p class="muted">사용자 유형을 선택해주세요.</p>

        <div class="register-choice">
            <a class="choice-card" href="{{ url_for('auth.register_student') }}">
                <span class="choice-icon">🎒</span>
                <span class="choice-title">학생으로 가입</span>
                <span class="choice-desc">퀴즈, 복습, 영어 듣고 쓰기 등을 이용해요.</span>
            </a>
            <a class="choice-card" href="{{ url_for('auth.register_parent') }}">
                <span class="choice-icon">👨‍👩‍👧</span>
                <span class="choice-title">학부모로 가입</span>
                <span class="choice-desc">자녀의 학습 현황을 확인하고 관리해요.</span>
            </a>
        </div>

        <p class="form-foot">이미 계정이 있나요? <a href="{{ url_for('auth.login') }}">로그인</a></p>
    </div>
</section>
{% endblock %}
