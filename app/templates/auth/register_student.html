{% extends "base.html" %}
{% block title %}학생 회원가입 · {{ t('app_name') }}{% endblock %}
{% block content %}
<section class="auth-shell">
    <div class="auth-card wide">
        <span class="eyebrow">나만의 학습 공간 만들기</span>
        <h1>학생 회원가입</h1>
        <form method="post" class="stack-form two-column" data-register>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>아이디<input name="username" required minlength="3" autocomplete="username"></label>
            <label>이메일<input type="email" name="email" required autocomplete="email"></label>
            <label>이름 또는 별명<input name="display_name" required></label>
            <label>비밀번호 (8자 이상)<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
            <label>학년
                <select name="grade_level" required>
                    {% for grade in range(1, 10) %}<option value="{{ grade }}" {% if grade == 4 %}selected{% endif %}>{{ grade_name(grade) }}</option>{% endfor %}
                </select>
            </label>
            <label>간편 로그인 PIN (4자리 숫자)
                <input type="password" name="simple_pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="4자리 숫자" required>
            </label>
            <label>화면 언어
                <select name="ui_language"><option value="ko">한국어</option><option value="en">English</option></select>
            </label>
            <input type="hidden" name="role" value="student">
            <button class="button primary full form-span" type="submit">가입하고 학습 시작</button>
        </form>
        <p class="form-foot">학부모이신가요? <a href="{{ url_for('auth.register_parent') }}">학부모 회원가입</a> · 이미 계정이 있나요? <a href="{{ url_for('auth.login') }}">로그인</a></p>
    </div>
</section>
{% endblock %}
