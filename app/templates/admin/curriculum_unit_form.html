{% extends "base.html" %}
{% block content %}
<section class="page-heading">
  <h1>{{ '단원 수정' if unit else '단원 등록' }}</h1>
  <p>교육과정 단원 정보를 입력하세요.</p>
</section>
<div class="auth-card form-panel">
  <form class="stack-form" method="post">
    <label>과목
      <select name="subject" required>
        <option value="math" {{ 'selected' if unit and unit.subject == 'math' else '' }}>수학</option>
        <option value="korean" {{ 'selected' if unit and unit.subject == 'korean' else '' }}>국어</option>
        <option value="english" {{ 'selected' if unit and unit.subject == 'english' else '' }}>영어</option>
        <option value="social" {{ 'selected' if unit and unit.subject == 'social' else '' }}>사회</option>
      </select>
    </label>
    <label>학년
      <select name="grade_level" required>
        {% for g in range(1, 10) %}
        <option value="{{ g }}" {{ 'selected' if unit and unit.grade_level == g else '' }}>{{ g }}학년</option>
        {% endfor %}
      </select>
    </label>
    <label>단원 번호
      <input type="number" name="unit_order" value="{{ unit.unit_order if unit else 1 }}" required>
    </label>
    <label>단원명
      <input type="text" name="unit_name" value="{{ unit.unit_name if unit else '' }}" required>
    </label>
    <label>학습목표
      <textarea name="learning_objective" rows="3">{{ unit.learning_objective if unit else '' }}</textarea>
    </label>
    <label>키워드
      <input type="text" name="keywords" value="{{ unit.keywords if unit else '' }}">
    </label>
    <button type="submit" class="button primary">{{ '수정' if unit else '등록' }}</button>
  </form>
</div>
{% endblock %}
