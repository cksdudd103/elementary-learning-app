{% extends "base.html" %}
{% block content %}
<section class="page-heading">
    <span class="eyebrow">영어 듣고 쓰기 결과</span>
    <h1>{{ score }}점</h1>
    <p>틀린 부분을 확인하고 다시 도전해 보세요.</p>
</section>

<section class="panel">
    <div class="section-head"><h2>내 답안</h2></div>
    <div class="result-list">
        {% for item in items %}
        <article class="result-item {{ 'correct' if item.is_correct else 'wrong' }}">
            <div class="result-icon">{{ 'O' if item.is_correct else 'X' }}</div>
            <div>
                <h3>정답: {{ item.correct }}</h3>
                <p>내 답: {{ item.answer or '(미입력)' }}</p>
            </div>
        </article>
        {% endfor %}
    </div>
</section>

<div class="center-actions">
    <a class="button primary" href="{{ url_for('student.english_dictation') }}">다시 듣고 쓰기</a>
    <a class="button secondary" href="{{ url_for('student.english_review') }}">영어 복습으로</a>
</div>
{% endblock %}
