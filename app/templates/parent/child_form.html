{% extends "base.html" %}
{% block content %}
<section class="page-heading"><span class="eyebrow">자녀 관리</span><h1>{{ '자녀 수정' if child else '자녀 등록' }}</h1><p>자녀 이름, 학년, 문제 풀이 시간을 입력하세요.</p></section>

<section class="panel form-panel">
    <form method="post" class="stack-form two-column">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="form-span">이름<input name="display_name" required value="{{ child.display_name if child else '' }}"></label>
        <label class="form-span">학년
            <select name="grade_level">
                {% for grade in range(1, 10) %}<option value="{{ grade }}" {% if child and child.grade_level == grade %}selected{% endif %}>{{ grade_name(grade) }}</option>{% endfor %}
            </select>
        </label>
        {% if child %}
        <label class="form-span">문제 풀이 제한 시간 (분)
            <input type="number" name="time_limit_minutes" min="1" max="180" value="{{ child.time_limit_seconds // 60 }}">
        </label>
        <p class="muted form-span">현재 설정: {{ child.time_limit_seconds // 60 }}분 ({{ child.time_limit_seconds }}초)</p>
        {% endif %}
        <div class="form-span center-actions"><button class="button primary" type="submit">저장</button><a class="button secondary" href="{{ url_for('parent.dashboard') }}">취소</a></div>
    </form>
</section>
{% endblock %}
