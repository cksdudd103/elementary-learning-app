{% extends "base.html" %}
{% block title %}자녀 연동 · {{ t('app_name') }}{% endblock %}
{% block content %}
<section class="page-heading"><span class="eyebrow">자녀 관리</span><h1>자녀 연동</h1><p>이미 가입한 학생의 이름과 학년을 입력하면 부모 계정과 연동됩니다.</p></section>

<section class="panel form-panel">
    <form method="post" class="stack-form two-column">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="form-span">학생 이름
            <input name="display_name" required placeholder="학생 계정에 등록된 이름">
        </label>
        <label class="form-span">학년
            <select name="grade_level">
                {% for grade in range(1, 10) %}<option value="{{ grade }}">{{ grade_name(grade) }}</option>{% endfor %}
            </select>
        </label>
        <p class="muted form-span">학생이 다른 학부모와 이미 연동되어 있으면 연동할 수 없습니다.</p>
        <div class="form-span center-actions">
            <button class="button primary" type="submit">연동하기</button>
            <a class="button secondary" href="{{ url_for('parent.dashboard') }}">취소</a>
        </div>
    </form>
</section>
{% endblock %}
