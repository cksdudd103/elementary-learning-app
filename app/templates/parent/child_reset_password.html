{% extends "base.html" %}
{% block title %}{{ child.display_name }} 학생 비밀번호 재설정 · {{ t('app_name') }}{% endblock %}
{% block content %}
<section class="auth-shell">
    <div class="auth-card">
        <span class="eyebrow">{{ grade_name(child.grade_level) }} · {{ child.display_name }}</span>
        <h1>학생 비밀번호 재설정</h1>
        <p class="muted">학생이 비밀번호를 잊은 경우 부모가 새로운 비밀번호로 변경할 수 있습니다.</p>

        <form method="post" class="stack-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>새 비밀번호
                <input type="password" name="new_password" required minlength="6" autocomplete="new-password">
            </label>
            <label>새 비밀번호 확인
                <input type="password" name="confirm_password" required minlength="6" autocomplete="new-password">
            </label>
            <button class="button primary full" type="submit">비밀번호 변경</button>
        </form>

        <p class="form-foot"><a href="{{ url_for('parent.dashboard') }}">학부모 홈으로</a></p>
    </div>
</section>
{% endblock %}
