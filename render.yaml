services:
  - type: web
    name: elementary-learning-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m gunicorn render_entry:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
