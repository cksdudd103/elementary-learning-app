services:
  - type: web
    name: elementary-learning-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python render_entry.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
